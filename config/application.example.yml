# =====================================================================
# [演示模板] C2C 外部配置（application.example.yml）
# ---------------------------------------------------------------------
# 这是"外部配置文件"的示例，演示怎么把真实敏感数据写到外部 config/。
#
# 完整配置结构在 src/main/resources/application*.yml（脱敏占位符，进仓库）；
# 本文件只写"敏感数据"（真实值），Spring Boot 启动时逐 key 合并：
#   外部写了哪个 key 就覆盖哪个，没写的沿用 classpath 内默认值。
#
# 使用方式：
#   1. 复制一份本文件，重命名为 application-pro.yml（本地开发，连服务器库）
#      或 application-prod.yml（生产服务器），放进 config/ 目录
#   2. 把下面所有 YOUR_XXX 占位符替换成你自己的真实值
#   3. 部署时把 config/ 目录放到 jar 同目录，Spring Boot 自动加载，
#      覆盖 jar 内 src/main/resources 的脱敏占位符，无需改代码重新打包
#
# 注意：真实配置文件（含真实密码）务必加入 .gitignore，不要上传仓库！
#    本 example 文件是安全的占位符版本，可以开源上传供他人参考。
# =====================================================================

spring:
  datasource:
    # 数据库连接：把主机、端口、库名换成你的
    url: jdbc:mysql://YOUR_DB_HOST:YOUR_DB_PORT/YOUR_DB_NAME?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: YOUR_DB_USER
    password: YOUR_DB_PASSWORD
  redis:
    # Redis：主机、端口、密码换成你的
    host: YOUR_REDIS_HOST
    port: YOUR_REDIS_PORT
    password: YOUR_REDIS_PASSWORD
  mail:
    # SMTP 邮箱配置（用于发送验证码邮件），QQ 邮箱示例：
    # host=smtp.qq.com, port=587, username=你的QQ邮箱, password=授权码（非登录密码）
    host: YOUR_MAIL_HOST
    port: YOUR_MAIL_PORT
    username: YOUR_MAIL_USERNAME
    password: YOUR_MAIL_PASSWORD

jwt:
  # JWT 签名密钥（HS256 要求 ≥ 32 字节），务必换成随机长字符串！
  secret: YOUR_JWT_SECRET

app:
  # 上传文件保存的根目录（推荐相对路径 ./uploads，基于启动目录/项目根目录；
  # 服务器部署可用绝对路径，如 /softservice/c2c/uploads）
  upload-root: YOUR_UPLOAD_ROOT

logging:
  file:
    # 日志文件路径（推荐相对路径 ./logs/app.log；服务器部署用绝对路径）
    name: YOUR_LOG_FILE
