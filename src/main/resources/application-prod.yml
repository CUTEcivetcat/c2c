# =====================================================================
# prod 环境配置（生产服务器）
#
# ⚠️ 本文件不含任何真实敏感值，全部走环境变量 / config/ 外部配置文件注入。
#    生产真实配置请放在 jar 同目录 config/application-prod.yml（已被 .gitignore 排除）。
# =====================================================================
server:
  address: 127.0.0.1
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1

spring:
  application:
    name: c2c-monolith
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:c2c}?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:your-db-password}
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:your-redis-password}
    database: ${REDIS_DATABASE:0}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:your-mail@example.com}
    password: ${MAIL_PASSWORD:your-mail-auth-code}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

jwt:
  # HS256 要求密钥 ≥ 32 字节(256 bit)，请务必设置你自己的随机密钥
  secret: ${JWT_SECRET:change-me-to-a-random-secret-at-least-32-bytes}
  expiration: ${JWT_EXPIRATION:604800}

app:
  upload-root: ${APP_UPLOAD_ROOT:/softservice/c2c/uploads}
  upload-url-prefix: /files

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  file:
    name: ${APP_LOG_FILE:/softservice/c2c/logs/app.log}
  level:
    com.c2c: info
