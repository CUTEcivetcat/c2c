# =====================================================
# C2C Nginx 配置模板（独立 server 块）
#
# 场景一：宝塔面板 —— 不要用本文件，用 baota-site.example.conf，
#         它是完整可整体替换的站点配置文件（含宝塔保留段）。
#
# 场景二：原生 Nginx（/etc/nginx/conf.d/）—— 本文件可直接用。
# 注意：宝塔环境站点配置在 /www/server/panel/vhost/nginx/，
#       命令行重载用 /www/server/nginx/sbin/nginx -t / -s reload
# =====================================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 50m;
    index index.html;

    # 后端接口
    location ^~ /api/v1/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 上传图片
    location ^~ /files/ {
        alias /softservice/c2c/uploads/;
        add_header Cache-Control "public, max-age=86400";
    }

    # 用户端静态文件（dist 放 /softservice/c2c/frontend/）
    location / {
        root /softservice/c2c/frontend;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 管理端（base=/admin/，dist 放 /softservice/c2c/admin-frontend/）
    location = /admin {
        return 301 /admin/;
    }
    location ^~ /admin/ {
        alias /softservice/c2c/admin-frontend/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # 博客（base=/blog/，dist 放 /softservice/c2c/blog/）
    location ^~ /blog/ {
        alias /softservice/c2c/blog/;
        index index.html;
        try_files $uri $uri/ /blog/index.html;
    }
}
