server
{
    listen 80;
    listen [::]:80;
    server_name YOUR_SERVER_IP;
    index index.html index.htm default.html;
    root /softservice/c2c/frontend;
    #CERT-APPLY-CHECK--START
    include /www/server/panel/vhost/nginx/well-known/YOUR_SERVER_IP.conf;
    #CERT-APPLY-CHECK--END
    include /www/server/panel/vhost/nginx/extension/YOUR_SERVER_IP/*.conf;

    #ERROR-PAGE-START
    #error_page 404 /404.html;
    #ERROR-PAGE-END

    #REWRITE-START
    include /www/server/panel/vhost/rewrite/YOUR_SERVER_IP.conf;
    #REWRITE-END

    # 禁止访问的敏感文件
    location ~* (\.user.ini|\.htaccess|\.htpasswd|\.env.*|\.project|\.bashrc|\.bash_profile|\.bash_logout|\.DS_Store|\.gitignore|\.gitattributes|LICENSE|README\.md|CHANGELOG\.md|CHANGELOG|CONTRIBUTING\.md|TODO\.md|FAQ\.md|composer\.json|composer\.lock|package(-lock)?\.json|yarn\.lock|pnpm-lock\.yaml|\.\w+~|\.swp|\.swo|\.bak(up)?|\.old|\.tmp|\.temp|\.log|\.sql(\.gz)?|docker-compose\.yml|docker\.env|Dockerfile|\.csproj|\.sln|Cargo\.toml|Cargo\.lock|go\.mod|go\.sum|phpunit\.xml|pom\.xml|build\.gradle|pyproject\.toml|requirements\.txt|application(-\w+)?\.(ya?ml|properties))$
    {
        return 404;
    }

    # 禁止访问的敏感目录
    location ~* /(\.git|\.svn|\.bzr|\.vscode|\.claude|\.idea|\.ssh|\.github|\.npm|\.yarn|\.pnpm|\.cache|\.husky|\.turbo|\.next|\.nuxt|node_modules|runtime)/ {
        return 404;
    }

    location ~ \.well-known{
        allow all;
    }

    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$
    {
        expires      30d;
        error_log /dev/null;
        access_log /dev/null;
    }

    location ~ .*\.(js|css)?$
    {
        expires      12h;
        error_log /dev/null;
        access_log /dev/null;
    }

    # ===== C2C 路由 =====
    location ^~ /api/v1/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location ^~ /files/ {
        alias /softservice/c2c/uploads/;
        add_header Cache-Control "public, max-age=86400";
    }

    location = /admin { return 301 /admin/; }
    location ^~ /admin/ {
        alias /softservice/c2c/admin-frontend/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    location ^~ /blog/ {
        alias /softservice/c2c/blog/;
        index index.html;
        try_files $uri $uri/ /blog/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log  /www/wwwlogs/YOUR_SERVER_IP.log;
    error_log  /www/wwwlogs/YOUR_SERVER_IP.error.log;
}
